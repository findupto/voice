name: Build Android APK
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: voice-pos-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: voicepos-debug-keystore-v1
      - name: Run Android unit-test and lint checks
        run: gradle :app:testDebugUnitTest :app:lintDebug --no-daemon
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Prepare downloadable APK
        run: cp app/build/outputs/apk/debug/app-debug.apk VoicePOS-${{ github.run_number }}.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: VoicePOS-APK-build-${{ github.run_number }}
          path: VoicePOS-${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 90
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v2.3.0-build-${{ github.run_number }}
          name: Voice POS Premium v2.3 build ${{ github.run_number }}
          body: |
            Enhanced Power Voice command understanding, structured menu OCR with variants and sizes, improved logo upload, and business backup/restore.
          files: VoicePOS-${{ github.run_number }}.apk
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
