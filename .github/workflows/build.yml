name: Build Android APK
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: voice-pos-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: voicepos-debug-keystore-v1
      - name: Run Android unit-test and lint checks
        run: gradle :app:testDebugUnitTest :app:lintDebug --no-daemon
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.conf
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and smoke-test APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant com.findupto.voicepos android.permission.RECORD_AUDIO
            adb shell pm grant com.findupto.voicepos android.permission.BLUETOOTH_SCAN
            adb shell pm grant com.findupto.voicepos android.permission.BLUETOOTH_CONNECT
            adb logcat -c
            adb shell am start -W -n com.findupto.voicepos/.MainActivity
            sleep 10
            adb shell pidof com.findupto.voicepos
            python3 - <<'PY'
            import subprocess, time, xml.etree.ElementTree as ET, re
            PKG = "com.findupto.voicepos"
            def adb(*args):
                return subprocess.run(["adb", *args], check=True, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT).stdout
            def nodes():
                adb("shell", "uiautomator", "dump", "/sdcard/voicepos-window.xml")
                return list(ET.fromstring(adb("exec-out", "cat", "/sdcard/voicepos-window.xml")).iter("node"))
            def locate(label):
                for n in nodes():
                    if n.attrib.get("text","").strip() == label or n.attrib.get("content-desc","").strip() == label:
                        m=re.fullmatch(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]", n.attrib.get("bounds",""))
                        if m:
                            x1,y1,x2,y2=map(int,m.groups()); return ((x1+x2)//2,(y1+y2)//2)
                return None
            def click(label, required=True):
                p=locate(label)
                if p is None:
                    if required: raise AssertionError("UI control missing: "+label)
                    return False
                adb("shell","input","tap",str(p[0]),str(p[1])); time.sleep(1.2); return True
            def expect(label):
                values=[n.attrib.get("text","")+" "+n.attrib.get("content-desc","") for n in nodes()]
                if not any(label in v for v in values): raise AssertionError("Expected UI content missing: "+label)
            # Finish first-launch opening-cash dialog if shown.
            if locate("CONTINUE"):
                field=next((n.attrib.get("bounds","") for n in nodes() if "EditText" in n.attrib.get("class","")), "")
                m=re.fullmatch(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]",field)
                if m:
                    x1,y1,x2,y2=map(int,m.groups()); adb("shell","input","tap",str((x1+x2)//2),str((y1+y2)//2)); adb("shell","input","text","1000")
                click("CONTINUE")
            expect("Power Voice")
            # Navigate every primary section and verify its screen is rendered.
            for tab, label in [("Menu","SMART MENU SCANNER"),("Kitchen","Kitchen Queue"),("Sales","Sales"),("Expenses","Expenses"),("Analytics","Analytics")]:
                click(tab); expect(label)
            click("Sale")
            click("ADD PRODUCTS"); expect("Quick custom product"); expect("ADD CUSTOM PRODUCT"); expect("Search menu")
            click("DONE")
            click("Settings"); expect("Business Transfer"); expect("Company Name"); click("SAVE")
            click("Tax, currency & service"); expect("Tax, Currency & Service"); click("CANCEL")
            click("Printer settings"); expect("Printer Settings"); expect("SCAN")
            click("SCAN", required=False); time.sleep(2); expect("Pair the thermal printer"); click("DONE")
            # Exercise the voice action launch; speech recognition itself requires real audio/service support.
            click("VOICE", required=False); time.sleep(2); adb("shell","input","keyevent","4")
            adb("shell","am","force-stop",PKG); adb("shell","am","start","-W","-n",PKG+"/.MainActivity"); time.sleep(4); adb("shell","pidof",PKG)
            print("PASS: install, launch, main tabs, manual product dialog, business settings, tax/currency settings, Bluetooth printer screen and voice action launch.")
            PY
            if adb logcat -d -s AndroidRuntime:E | grep -q 'FATAL EXCEPTION'; then
              adb logcat -d -s AndroidRuntime:E
              exit 1
            fi
      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Prepare downloadable APK
        run: cp app/build/outputs/apk/debug/app-debug.apk VoicePOS-${{ github.run_number }}.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: VoicePOS-APK-build-${{ github.run_number }}
          path: VoicePOS-${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 90
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v2.3.0-build-${{ github.run_number }}
          name: Voice POS Premium v2.3 build ${{ github.run_number }}
          body: |
            Enhanced Power Voice command understanding, structured menu OCR with variants and sizes, improved logo upload, and business backup/restore.
          files: VoicePOS-${{ github.run_number }}.apk
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
